name: python

# Tests python/ on the oldest and newest supported Python. A py-v* tag also publishes
# it to PyPI by trusted publishing, so no token is stored anywhere. The publisher on
# pypi.org: project proxmint, owner proxmint, repository free-proxy-list, workflow
# python.yml, environment pypi.
on:
  push:
    branches: [main]
    paths: [python/**, .github/workflows/python.yml]
    tags: ["py-v*"]
  pull_request:
    paths: [python/**]

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} --group test pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
